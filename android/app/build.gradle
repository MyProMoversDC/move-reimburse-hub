apply plugin: 'com.android.application'

// Detect a release keystore before configuring the android { } block. Two modes:
//   1. Local Android Studio without a keystore -> no signingConfigs.release is
//      defined and buildTypes.release has no explicit signingConfig. Debug
//      builds work as usual; Release builds produce an unsigned artifact (AS
//      can still assemble it; it just cannot be uploaded to Play as-is).
//   2. CI (or a local dev who provides env vars / drops a keystore at
//      android/keystore/release.keystore) -> signingConfigs.release is defined
//      from the env vars and wired into buildTypes.release, producing a
//      Play-ready signed .aab. Matches the existing GitHub Actions workflow.
def keystorePathEnv = System.getenv("ANDROID_KEYSTORE_PATH")
def defaultKeystore = file("../keystore/release.keystore")
def resolvedKeystore = keystorePathEnv ? file(keystorePathEnv) : (defaultKeystore.exists() ? defaultKeystore : null)
def hasReleaseKeystore = resolvedKeystore != null && resolvedKeystore.exists()

android {
    namespace "com.mypromovers.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mypromovers.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files/dirs to exclude from APK — matches Capacitor default.
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile resolvedKeystore
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            // Otherwise: no explicit signingConfig. Local Release builds are
            // unsigned; CI provides the keystore via env vars.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase — matches ios/App/Podfile FirebaseCore/FirebaseMessaging pods.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
