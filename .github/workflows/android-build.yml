name: Android Build (Google Play)

# Produces a signed .aab for Google Play Internal Testing on GitHub-hosted
# ubuntu runners. No local Android toolchain required.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64     - base64 of your existing release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD   - keystore password
#   ANDROID_KEY_ALIAS           - key alias inside the keystore
#   ANDROID_KEY_PASSWORD        - password for that alias
#   GOOGLE_SERVICES_JSON_BASE64 - base64 of android google-services.json (FCM)
#
# Optional (auto-upload to Play Internal Testing track):
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON - JSON for a Play Console service account
#
# Generate base64 on any machine:
#   base64 -w0 release.keystore | xclip -selection clipboard
#   base64 -w0 google-services.json | xclip -selection clipboard

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (e.g. 1.0.42). Leave blank to auto-derive.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.mypromovers.app
      # versionCode MUST strictly increase for every release Google Play accepts.
      # github.run_number is monotonic per workflow per repo, so it satisfies that.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name || format('1.0.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - name: Fail if any Lovable preview URL leaked into build inputs
        run: |
          set -e
          HITS=$(grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
              -e 'lovableproject\.com' \
              capacitor.config.ts index.html vite.config.ts \
              .env .env.production .env.local ios 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: Lovable preview URL found in build inputs:"
            echo "$HITS"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Clean previous web build
        run: rm -rf dist

      - name: Build web assets
        env:
          CAP_SERVER_URL: ''
        run: npm run build

      - name: Add Android platform if missing (preserves existing native project)
        env:
          CAP_SERVER_URL: ''
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not present — running npx cap add android (first-time setup)"
            npx cap add android
          else
            echo "android/ already present — preserving existing native project"
          fi

      - name: Sync Capacitor (Android)
        env:
          CAP_SERVER_URL: ''
        run: npx cap sync android

      - name: Drop google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Inject versionCode / versionName
        run: |
          set -e
          GRADLE=android/app/build.gradle
          test -f "$GRADLE"
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" "$GRADLE"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"${VERSION_NAME}\"/" "$GRADLE"
          echo "Patched versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Assert no remote server URL in synced native project
        run: |
          set -e
          if grep -RIn 'lovableproject\.com' android 2>/dev/null; then
            echo "ERROR: lovableproject.com URL found inside synced android/ project."
            exit 1
          fi
          CFG=android/app/src/main/assets/capacitor.config.json
          if [ -f "$CFG" ] && grep -E '"url"[[:space:]]*:' "$CFG" >/dev/null; then
            echo "ERROR: synced capacitor.config.json still contains a server.url:"
            cat "$CFG"
            exit 1
          fi

      - name: Decode keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.keystore
          test -s android/keystore/release.keystore

      - name: Configure signing in build.gradle (idempotent)
        run: |
          set -e
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs {" "$GRADLE"; then
            # Write a python helper to /tmp so YAML indentation does not break Python.
            cat > /tmp/patch_gradle.py <<'PY'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../keystore/release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          src = re.sub(r'(android\s*\{)', r'\1' + signing, src, count=1)
          src = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              src, count=1,
          )
          p.write_text(src)
          PY
            # Strip the 10-space YAML indent that bash preserved in the heredoc.
            sed -i 's/^          //' /tmp/patch_gradle.py
            python3 /tmp/patch_gradle.py "$GRADLE"
          fi
          grep -n "signingConfig" "$GRADLE" || true


      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find android/app/build/outputs/bundle -name "*-release.aab" | head -n1)
          test -n "$AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          ls -la "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mypromovers-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30

      - name: Upload to Google Play Internal Testing (optional)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mypromovers.app
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed
